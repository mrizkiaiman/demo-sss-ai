stages:
  - checks

workstation:
  stage: checks
  image: python:3.13-slim
  before_script:
    - python -m venv .venv
    - .venv/bin/python -m pip install -r requirements.txt
  script:
    - .venv/bin/python -m compileall -q cli
    - .venv/bin/python -m cli --validate
    - .venv/bin/python -m cli --help
