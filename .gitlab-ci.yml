stages:
  - security
  - checks

workstation:
  stage: checks
  image: python:3.13-slim
  before_script:
    - python -m venv .venv
    - .venv/bin/python -m pip install -r requirements.txt
  script:
    - .venv/bin/python -m compileall -q cli
    - .venv/bin/python -m cli --validate
    - .venv/bin/python -m cli --help

gitleaks:
  stage: security
  image: golang:1.24-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - go install github.com/gitleaks/gitleaks/v8@v8.30.1
    - export PATH="$(go env GOPATH)/bin:$PATH"
  script:
    - gitleaks git -c "$CI_PROJECT_DIR/security/gitleaks.toml" --redact --verbose .
