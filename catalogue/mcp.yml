---
presentation:
  os_compatibility: [macos, linux, windows-wsl2]
  installation_complexity: low
  note: Adds the selected server to each client's native configuration file.

metadata:
  codebase-memory-mcp:
    os_compatibility: [macos, linux, windows-wsl2]
    installation_complexity: medium
    transport: local-process
    network: package-download
    auth: none
    data_access: repository
    data_label: Your project files
    side_effects: local-index
    note: Runs locally and may download the pinned package during setup.
  sentry:
    os_compatibility: [macos, linux, windows-wsl2]
    installation_complexity: medium
    transport: remote-https
    network: outbound
    auth: oauth
    data_access: external-project
    data_label: Your Sentry project data
    side_effects: provider-defined
    note: Connects to Sentry and completes OAuth in the client after installation.
  jira:
    os_compatibility: [macos, linux, windows-wsl2]
    installation_complexity: medium
    transport: remote-https
    network: outbound
    auth: oauth
    data_access: external-project
    data_label: Your Jira project data
    side_effects: provider-defined
    note: Connects to Jira and completes OAuth in the client after installation.

mcp_servers:
  codebase-memory-mcp:
    command: npx
    args: [-y, codebase-memory-mcp@0.11.0]
    startup_timeout_sec: 60
  sentry:
    url: https://mcp.sentry.dev/mcp
  jira:
    url: https://mcp.atlassian.com/v2/mcp
